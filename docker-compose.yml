services:
  mongodb:
    image: mongo:7.0
    container_name: driftwatch_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=driftwatch_db
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
      - backend_models:/app/models
    environment:
      - PORT=8000
      - MONGO_URI=mongodb://mongodb:27017
      - JWT_SECRET=change_this_secret
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - PORT=3000

volumes:
  mongodb_data:
  backend_data:
  backend_models:

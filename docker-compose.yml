services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
      - backend_models:/app/models
    environment:
      - PORT=8000
      - DATABASE_PATH=/app/data/driftwatch.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - PORT=3000

volumes:
  backend_data:
  backend_models:
